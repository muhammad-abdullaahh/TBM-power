<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Leads - TBM Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .lead-detail-cell { font-size: 0.88em; color: #555; }
        .search-bar { padding: 9px 14px; border: 1px solid #ddd; border-radius: 4px; width: 260px; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">TBM Admin</div>
            <nav class="sidebar-nav">
                <a href="index.html">Dashboard</a>
                <a href="orders.html">Orders</a>
                <a href="products.html">Products</a>
                <a href="leads.html" class="active">Solar Leads</a>
                <a href="#" id="logoutBtn" style="margin-top: auto; border-top: 1px solid #444;">Return to home</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="header-bar">
                <h1>Solar Leads</h1>
                <div>
                    <input type="text" class="search-bar" id="leadsSearch" placeholder="Search by name or phone...">
                </div>
            </div>

            <div class="card" style="padding: 0; overflow-x: auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Date</th>
                            <th>Customer</th>
                            <th>Contact</th>
                            <th>Location</th>
                            <th>System Type</th>
                            <th>Bill Range</th>
                            <th>Sizing Details</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTableBody">
                        <tr><td colspan="8" style="text-align:center;">Loading leads...</td></tr>
                    </tbody>
                </table>
            </div>
            <p id="leadsCount" style="margin-top:10px; color:#888; font-size:0.9em;"></p>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/leads.js"></script>
</body>
</html>
